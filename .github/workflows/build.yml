
name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build APK with Android Build Tools
        run: |
          mkdir -p bin compiled app/src/main/java/com/example/bacachat app/src/main/res/layout
          
          # Rapikan posisi file jika ada di root
          [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/com/example/bacachat/
          [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          
          # Compile resource XML
          $ANDROID_HOME/build-tools/33.0.0/aapt2 compile --dir app/src/main/res -o compiled/
          $ANDROID_HOME/build-tools/33.0.0/aapt2 link -I $ANDROID_HOME/platforms/android-33/android.jar \
            --manifest app/src/main/AndroidManifest.xml \
            -o bin/app-unsigned.apk compiled/*.flat --auto-add-overlay

          # Compile Java Code
          find app/src/main/java -name "*.java" > sources.txt
          javac -d bin -classpath $ANDROID_HOME/platforms/android-33/android.jar @sources.txt

          # Add class files to APK
          cd bin
          $ANDROID_HOME/build-tools/33.0.0/d8 *.class --output . || true
          zip -u app-unsigned.apk classes.dex || true
          
          # Sign APK
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $ANDROID_HOME/build-tools/33.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out app-debug.apk app-unsigned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Livechat-Reading-APK
          path: bin/app-debug.apk
          
