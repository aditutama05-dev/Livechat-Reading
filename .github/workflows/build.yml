name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/bacachat
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # 1. UI Drawables
          cat << 'EOF' > app/src/main/res/drawable/bg_card.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1E1E2C"/>
              <corners android:radius="16dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_button.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient 
                  android:startColor="#6A11CB" 
                  android:endColor="#2575FC" 
                  android:angle="45"/>
              <corners android:radius="12dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_overlay_panel.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#EE11111E"/>
              <corners android:radius="20dp"/>
              <stroke android:width="1dp" android:color="#44FFFFFF"/>
          </shape>
          EOF

          # 2. Activity Layout
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#121212"
              android:padding="20dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="📖 Baca Livechat Pro"
                      android:textColor="#FFFFFF"
                      android:textSize="22sp"
                      android:textStyle="bold"
                      android:layout_marginBottom="16dp"/>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="@drawable/bg_card"
                      android:padding="16dp"
                      android:layout_marginBottom="16dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="PILIH MODE BACA"
                          android:textColor="#888888"
                          android:textSize="12sp"
                          android:textStyle="bold"
                          android:layout_marginBottom="10dp"/>

                      <RadioGroup
                          android:id="@+id/rgMode"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical">

                          <RadioButton
                              android:id="@+id/rbLiveStream"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="🎥 Mode Live Stream (Kotak Overlay Chat)"
                              android:textColor="#FFFFFF"
                              android:textSize="14sp"
                              android:checked="true"
                              android:padding="8dp"/>

                          <RadioButton
                              android:id="@+id/rbReadingBiasa"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="📄 Mode Reading Biasa (Aksesibilitas)"
                              android:textColor="#FFFFFF"
                              android:textSize="14sp"
                              android:padding="8dp"/>
                      </RadioGroup>
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="@drawable/bg_card"
                      android:padding="16dp"
                      android:layout_marginBottom="16dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="PENGATURAN SUARA"
                          android:textColor="#888888"
                          android:textSize="12sp"
                          android:textStyle="bold"
                          android:layout_marginBottom="10dp"/>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical">

                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="🔊 Baca Otomatis (TTS)"
                              android:textColor="#FFFFFF"
                              android:textSize="14sp"/>

                          <Switch
                              android:id="@+id/swAutoRead"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:checked="true"/>
                      </LinearLayout>
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="@drawable/bg_card"
                      android:padding="16dp"
                      android:layout_marginBottom="20dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="LINK / ID STREAMING (OPSIONAL)"
                          android:textColor="#888888"
                          android:textSize="12sp"
                          android:textStyle="bold"
                          android:layout_marginBottom="8dp"/>

                      <EditText
                          android:id="@+id/etUrl"
                          android:layout_width="match_parent"
                          android:layout_height="50dp"
                          android:hint="Tempel URL Live di sini..."
                          android:textColorHint="#555555"
                          android:textColor="#FFFFFF"
                          android:padding="12dp"
                          android:background="#2A2A3C"/>
                  </LinearLayout>

                  <Button
                      android:id="@+id/btnStartOverlay"
                      android:layout_width="match_parent"
                      android:layout_height="55dp"
                      android:text="🚀 AKTIFKAN IKON MELAYANG"
                      android:textColor="#FFFFFF"
                      android:textSize="15sp"
                      android:textStyle="bold"
                      android:background="@drawable/bg_button"/>

                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Status: Siap dijalankan"
                      android:textColor="#00FF88"
                      android:textSize="13sp"
                      android:gravity="center"
                      android:layout_marginTop="16dp"/>

              </LinearLayout>
          </ScrollView>
          EOF

          # 3. FloatingService.java
          cat << 'EOF' > app/src/main/java/com/example/bacachat/FloatingService.java
          package com.example.bacachat;

          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.IBinder;
          import android.speech.tts.TextToSpeech;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.Toast;

          import java.util.Locale;

          public class FloatingService extends Service implements TextToSpeech.OnInitListener {

              private WindowManager windowManager;
              private View overlayBox;
              private LinearLayout controlLayout;
              private TextToSpeech tts;
              private boolean isLocked = false;
              private boolean isHidden = false;
              private boolean isLiveMode = true;

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null) {
                      isLiveMode = intent.getBooleanExtra("IS_LIVE_MODE", true);
                      if (!isLiveMode && overlayBox != null) {
                          overlayBox.setVisibility(View.GONE);
                      } else if (isLiveMode && overlayBox != null && !isHidden) {
                          overlayBox.setVisibility(View.VISIBLE);
                      }
                  }
                  return START_STICKY;
              }

              @Override
              public void onCreate() {
                  super.onCreate();

                  tts = new TextToSpeech(this, this);
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);

                  int layoutType = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ?
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY :
                          WindowManager.LayoutParams.TYPE_PHONE;

                  overlayBox = new View(this);
                  overlayBox.setBackgroundColor(Color.parseColor("#3300FF88"));

                  final WindowManager.LayoutParams boxParams = new WindowManager.LayoutParams(
                          650, 450,
                          layoutType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                  );
                  boxParams.gravity = Gravity.CENTER;

                  controlLayout = new LinearLayout(this);
                  controlLayout.setOrientation(LinearLayout.HORIZONTAL);
                  controlLayout.setPadding(20, 10, 20, 10);
                  controlLayout.setBackgroundResource(R.drawable.bg_overlay_panel);

                  final Button btnLock = new Button(this);
                  btnLock.setText("🔒 Lock");

                  final Button btnHide = new Button(this);
                  btnHide.setText("👁️ Sembunyi");

                  final Button btnClose = new Button(this);
                  btnClose.setText("❌ Tutup");

                  controlLayout.addView(btnLock);
                  controlLayout.addView(btnHide);
                  controlLayout.addView(btnClose);

                  final WindowManager.LayoutParams controlParams = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          layoutType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                  );
                  controlParams.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  controlParams.y = 120;

                  try {
                      windowManager.addView(overlayBox, boxParams);
                      windowManager.addView(controlLayout, controlParams);
                  } catch (Exception e) {
                      e.printStackTrace();
                  }

                  overlayBox.setOnTouchListener(new View.OnTouchListener() {
                      private int initialX, initialY;
                      private float initialTouchX, initialTouchY;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          if (isLocked) return false;

                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  initialX = boxParams.x;
                                  initialY = boxParams.y;
                                  initialTouchX = event.getRawX();
                                  initialTouchY = event.getRawY();
                                  return true;

                              case MotionEvent.ACTION_MOVE:
                                  boxParams.x = initialX + (int) (event.getRawX() - initialTouchX);
                                  boxParams.y = initialY + (int) (event.getRawY() - initialTouchY);
                                  try {
                                      windowManager.updateViewLayout(overlayBox, boxParams);
                                  } catch (Exception ignored) {}
                                  return true;
                          }
                          return false;
                      }
                  });

                  btnLock.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          isLocked = !isLocked;
                          btnLock.setText(isLocked ? "🔒 Terkunci" : "🔓 Lock");
                          Toast.makeText(FloatingService.this, isLocked ? "Kotak Terkunci" : "Kotak Bebas Digeser", Toast.LENGTH_SHORT).show();
                      }
                  });

                  btnHide.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          isHidden = !isHidden;
                          if (isLiveMode) {
                              overlayBox.setVisibility(isHidden ? View.GONE : View.VISIBLE);
                          }
                          btnHide.setText(isHidden ? "👁️ Tampil" : "👁️ Sembunyi");
                      }
                  });

                  btnClose.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          stopSelf();
                      }
                  });
              }

              @Override
              public void onInit(int status) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts.setLanguage(new Locale("id", "ID"));
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }
                  try {
                      if (overlayBox != null) windowManager.removeView(overlayBox);
                      if (controlLayout != null) windowManager.removeView(controlLayout);
                  } catch (Exception ignored) {}
              }
          }
          EOF

          # 4. MainActivity.java
          cat << 'EOF' > app/src/main/java/com/example/bacachat/MainActivity.java
          package com.example.bacachat;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.Button;
          import android.widget.RadioButton;
          import android.widget.Switch;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private RadioButton rbLiveStream;
              private Switch swAutoRead;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  rbLiveStream = findViewById(R.id.rbLiveStream);
                  swAutoRead = findViewById(R.id.swAutoRead);
                  Button btnStartOverlay = findViewById(R.id.btnStartOverlay);

                  btnStartOverlay.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(MainActivity.this)) {
                              Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse("package:" + getPackageName()));
                              startActivityForResult(intent, 100);
                          } else {
                              startFloatingService();
                          }
                      }
                  });
              }

              private void startFloatingService() {
                  boolean isLiveMode = rbLiveStream.isChecked();
                  boolean isAutoRead = swAutoRead.isChecked();

                  Intent serviceIntent = new Intent(MainActivity.this, FloatingService.class);
                  serviceIntent.putExtra("IS_LIVE_MODE", isLiveMode);
                  serviceIntent.putExtra("IS_AUTO_READ", isAutoRead);
                  startService(serviceIntent);

                  Toast.makeText(this, "Ikon Melayang Aktif!", Toast.LENGTH_SHORT).show();
              }
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.bacachat">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Baca Livechat"
           
