name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/bacachat
          mkdir -p app/src/main/res/layout

          [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/com/example/bacachat/ || true
          [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/ || true
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/ || true

          # Otomatis buat settings.gradle bersih
          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          # Otomatis buat build.gradle bersih
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # Otomatis buat app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.bacachat'
              compileSdk 33

              defaultConfig {
                  applicationId "com.example.bacachat"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          gradle wrapper

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Livechat-Reading-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
